<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>joerny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      /* palette — a calm slate-blue dark theme */
      --bg: #0c0e13;
      --panel: #14171f;
      --panel-2: #1c202a;
      --border: #282e3a;
      --text: #e8ebf2;
      --muted: #8b93a7;
      --accent: #7aa2ff;
      --accent-2: #a78bfa;
      --accent-dim: #2c3b60;
      --graph: #6ea8fe;
      --table: #6fd7a3;
      --note: #e6b566;
      /* type + surface tokens */
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 8px;
      --shadow: 0 6px 22px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 13px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background:
        radial-gradient(1100px 620px at 78% -8%, rgba(122, 162, 255, .07), transparent 60%),
        radial-gradient(900px 520px at 8% 108%, rgba(167, 139, 250, .06), transparent 55%),
        var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      grid-template-rows: 42px 1fr;
      grid-template-areas: "head head head" "left center right";
      height: 100vh;
    }
    header {
      grid-area: head; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), var(--bg));
    }
    header .logo {
      font-weight: 700; font-size: 15px; letter-spacing: .3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header .status { color: var(--muted); font-size: 12px; }
    header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #d9534f; margin-right: 5px; vertical-align: middle; }
    header .status.connected .dot { background: #5cb85c; }
    #left { grid-area: left; border-right: 1px solid var(--border); background: var(--panel);
      display: flex; flex-direction: column; overflow: hidden; }
    #center { grid-area: center; overflow: hidden; position: relative; background: transparent;
      display: flex; flex-direction: column; }
    #centerToolbar { display: none; align-items: center; gap: 6px; padding: 6px 10px;
      border-bottom: 1px solid var(--border); background: var(--panel); }
    #centerToolbar .tab { font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); }
    #centerToolbar .tab.active { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
    #centerToolbar .tab[disabled] { opacity: .4; cursor: default; }
    #legend { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center;
      gap: 10px; color: var(--muted); font-size: 11px; justify-content: flex-end; max-width: 62%; }
    .lg-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .lg-line { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
    .lg-badge { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; padding: 1px 5px;
      border-radius: 8px; color: var(--bg); font-weight: 700; }
    .lg-hint { font-style: italic; opacity: .8; }
    #kindLegend { display: flex; gap: 10px; padding: 0 12px 8px; color: var(--muted); font-size: 10px; }
    #centerBody { flex: 1; position: relative; overflow: hidden; }
    /* ---- trace scrubber (timeline) ---- */
    #timeline { border-top: 1px solid var(--border); background: var(--panel);
      padding: 6px 10px 8px; user-select: none; }
    .tl-head { display: flex; align-items: center; gap: 8px; font-size: 11px;
      color: var(--muted); margin-bottom: 6px; }
    .tl-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; cursor: pointer; font-size: 10px; padding: 2px 7px; line-height: 1; }
    .tl-btn:hover { border-color: var(--accent); }
    .tl-count { font-variant-numeric: tabular-nums; color: var(--text); }
    .tl-step-cur { color: var(--text); font-weight: 600; max-width: 220px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .tl-tally { margin-left: auto; display: inline-flex; gap: 10px; }
    .tl-grounded { color: var(--table); }
    .tl-art { color: var(--muted); }
    .tl-art.hot { color: #e06c6c; font-weight: 700; }
    .tl-live { color: var(--muted); }
    .tl-live.on { color: #5cb85c; }
    .tl-track { position: relative; cursor: pointer; padding-top: 14px; touch-action: none; }
    .tl-steps { display: flex; gap: 2px; height: 12px; margin-bottom: 3px; }
    .tl-step { background: var(--panel-2); border-radius: 3px; font-size: 9px; color: var(--muted);
      padding: 0 4px; line-height: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid var(--border); }
    .tl-step-none { background: transparent; border-color: transparent; }
    .tl-ticks { display: flex; height: 20px; align-items: center; }
    .tl-cell { flex: 1; display: flex; justify-content: center; align-items: center; }
    .tl-tick { width: 10px; height: 10px; border-radius: 50%; background: var(--border);
      transition: transform .1s; }
    .tl-tick.kind-graph.on { background: var(--graph); }
    .tl-tick.kind-table.on { background: var(--table); }
    .tl-tick.kind-note.on { background: var(--note); }
    .tl-tick.off { opacity: .3; }
    .tl-tick.art { box-shadow: 0 0 0 2px #e06c6c; }
    .tl-tick.cur { transform: scale(1.5); }
    .tl-playhead { position: absolute; top: 12px; bottom: 0; width: 2px; background: var(--accent);
      pointer-events: none; transform: translateX(-1px); }
    .layer-item.future { opacity: .38; }
    #right { grid-area: right; border-left: 1px solid var(--border); background: var(--panel);
      overflow: auto; padding: 12px; }
    .section-title { text-transform: uppercase; letter-spacing: .8px; font-size: 10px; font-weight: 600;
      color: var(--muted); padding: 12px 12px 6px; }
    /* thin, unobtrusive scrollbars */
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4152; }
    ::-webkit-scrollbar-track { background: transparent; }
    #lineage { height: 190px; border-bottom: 1px solid var(--border); }
    #layerList { flex: 1; overflow: auto; }
    .layer-item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; gap: 8px; }
    .layer-item:hover { background: var(--panel-2); }
    .layer-item.selected { background: var(--accent-dim); }
    .layer-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kind-badge { font-size: 9px; text-transform: uppercase; letter-spacing: .5px;
      padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--bg); font-weight: 700; }
    .kind-graph { background: var(--graph); }
    .kind-table { background: var(--table); }
    .kind-note  { background: var(--note); }
    #cy, #projection { width: 100%; height: 100%; }
    #tableWrap, #noteWrap { width: 100%; height: 100%; overflow: auto; padding: 16px; }
    table.data { border-collapse: collapse; width: 100%; }
    table.data th, table.data td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    table.data th { background: var(--panel-2); position: sticky; top: 0; }
    .note-body { max-width: 820px; }
    .note-body h1, .note-body h2, .note-body h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .note-body code { background: var(--panel-2); padding: 1px 4px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; }
    .note-body pre { background: var(--panel-2); padding: 12px; border-radius: var(--radius); overflow: auto; }
    .note-body pre code { font-size: 12px; }
    .empty { color: var(--muted); display: flex; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    #right h3 { margin: 0 0 6px; font-size: 12px; }
    .narration { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; margin-bottom: 12px; white-space: pre-wrap; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-bottom: 12px; }
    .kv .k { color: var(--muted); }
    .kv .v { word-break: break-all; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--panel-2);
      border: 1px solid var(--border); cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    .hint { color: var(--muted); font-size: 12px; }
    /* Requirement / evidence inspector */
    pre.code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; margin: 0 0 12px; overflow: auto; max-height: 320px;
      font-family: var(--font-mono); font-size: 11px;
      line-height: 1.45; white-space: pre; color: #d6dbe6; }
    pre.code.src { max-height: 420px; }
    .req-text { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--accent);
      background: var(--panel-2); border-radius: 0 6px 6px 0; font-size: 13px; }
    .status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .status-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
      padding: 2px 8px; border-radius: 10px; color: #0f1115; }
    .status-badge.st-supported { background: #7ed6a5; }
    .status-badge.st-unverified { background: #e0b978; }
    .status-badge.st-unsupported { background: #f0616d; color: #fff; }
    .gate { color: var(--muted); font-size: 11px; }
    .callout { background: rgba(240,97,109,.12); border: 1px solid #f0616d; color: #f4a6ad;
      border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; font-size: 12px; }
    .loc { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
    /* Navigation: back/forward + breadcrumb trail so drilling keeps its context */
    #navbar { display: flex; align-items: center; gap: 6px; padding: 5px 10px;
      border-bottom: 1px solid var(--border); background: var(--panel); min-height: 32px; }
    .nav-btn { font-size: 13px; line-height: 1; width: 24px; height: 22px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; }
    .nav-btn:hover:not(:disabled) { border-color: var(--accent); }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    #breadcrumb { display: flex; align-items: center; gap: 3px; flex: 1; min-width: 0;
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #breadcrumb::-webkit-scrollbar { display: none; }
    #breadcrumb .crumb, #breadcrumb .crumb-via { flex: 0 0 auto; }
    .crumb { font-size: 11px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2);
      color: var(--muted); cursor: pointer; }
    .crumb:hover { border-color: var(--accent); color: var(--text); }
    .crumb.current { color: var(--text); border-color: var(--accent); background: var(--accent-dim); cursor: default; }
    .crumb-via { font-size: 9px; color: var(--muted); opacity: .7; margin: 0 1px; }
    .crumb-via::before { content: "\2192 "; }
    .crumb-hint { font-size: 11px; color: var(--muted); font-style: italic; }
    /* Provenance: badges + dashed/dotted connector samples in the legend */
    .origin-badge { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; padding: 1px 5px;
      border-radius: 8px; font-weight: 700; }
    .origin-badge.origin-llm { background: rgba(200,143,251,.2); border: 1px solid #c88ffb; color: #d9b6fc; }
    .origin-badge.origin-manual { background: rgba(224,185,120,.2); border: 1px solid #e0b978; color: #e9cd97; }
    .lg-origin { width: 16px; height: 0; display: inline-block; vertical-align: middle; }
    .lg-origin-solid { border-top: 2px solid var(--muted); }
    .lg-origin-dashed { border-top: 2px dashed #c88ffb; }
    .lg-origin-dotted { border-top: 2px dotted #e0b978; }
    .chip.fact { border-color: var(--accent-dim); }
    .chip.fact.missing { opacity: .5; cursor: default; text-decoration: line-through; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <span class="logo">joerny</span>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></span>
    <span style="flex:1"></span>
    <span class="status" id="sessionLabel"></span>
  </header>
  <aside id="left">
    <div class="section-title">Lineage</div>
    <div id="lineage"></div>
    <div id="kindLegend"></div>
    <div class="section-title">Layers</div>
    <div id="layerList"></div>
  </aside>
  <main id="center">
    <div id="navbar">
      <button id="navBack" class="nav-btn" title="Back (Alt+Left)" disabled>&#8592;</button>
      <button id="navForward" class="nav-btn" title="Forward (Alt+Right)" disabled>&#8594;</button>
      <div id="breadcrumb"><span class="crumb-hint">nothing selected</span></div>
    </div>
    <div id="centerToolbar">
      <span class="tab" id="tabPrimary">Layer</span>
      <span class="tab" id="tabProjection">Projection</span>
      <span id="legend"></span>
    </div>
    <div id="centerBody">
      <div class="empty" id="centerEmpty">Waiting for the agent to emit a layer…<br /><span class="hint">Point Joern scripts at JOERNY_DIR and call joerny.graph/table/note(...).emit()</span></div>
      <div id="cy" style="display:none"></div>
      <div id="projection" style="display:none"></div>
      <div id="tableWrap" style="display:none"></div>
      <div id="noteWrap" style="display:none"></div>
    </div>
    <div id="timeline" style="display:none"></div>
  </main>
  <aside id="right">
    <div class="empty hint" id="rightEmpty">Select a layer to inspect it.</div>
    <div id="inspector" style="display:none"></div>
  </aside>
  <script>
    // Static index.html can't know the per-session key, so bootstrap the bundle
    // with the key from the current URL (the server requires ?key= on all paths).
    (function () {
      var key = new URLSearchParams(location.search).get("key") || "";
      var s = document.createElement("script");
      s.src = "/bundle.js?key=" + encodeURIComponent(key);
      s.defer = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
